services:
  postgres:
    image: postgres:16
    env_file:
      - .env.postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kora-ai

  pgvector:
    image: pgvector/pgvector:pg16
    env_file:
      - ./pgvector/.env
    ports:
      - "5433:5432"
    volumes:
      - "pgvector_data:/var/lib/postgresql/data"
      - "./pgvector/init:/docker-entrypoint-initdb.d"
    networks:
      - kora-ai

  #svc-management:
  # build:
  #    context: ./svc-management
  # env_file:
  #    - ./svc-management/.env
  #  ports:
  #    - "8001:8000"
  #  networks:
  #    - kora-ai

  svc-agent:
    build:
      context: ./svc-agent
    env_file:
      - ./svc-agent/.env
    ports:
      - "8000:8000"
    networks:
      - kora-ai

volumes:
  postgres_data:
  pgvector_data:

networks:
  kora-ai:

services:
  postgres:
    image: postgres:16
    env_file:
      - .env.postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kora-ai

  pgvector:
    image: pgvector/pgvector:pg16
    env_file:
      - ./pgvector/.env
    ports:
      - "5433:5432"
    volumes:
      - "pgvector_data:/var/lib/postgresql/data"
      - "./pgvector/init:/docker-entrypoint-initdb.d"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kora-ai

  svc-management:
    build:
      context: ./svc-management
    env_file:
      - ./svc-management/.env
    ports:
      - "8001:8000"
    networks:
      - kora-ai

  svc-agent:
    build:
      context: ./svc-agent
    env_file:
      - ./svc-agent/.env
    ports:
      - "8000:8000"
    networks:
      - kora-ai

  svc-ingestion:
    build:
      context: ./svc-ingestion
    env_file:
      - ./svc-ingestion/.env
    ports:
      - "8002:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - kora-ai
    volumes:
      - ./svc-ingestion/app/_ingestion:/app/_ingestion
      #- ./svc-ingestion/app:/app
      - hf_cache:/root/.cache/huggingface/hub
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  postgres_data:
  pgvector_data:
  hf_cache:

networks:
  kora-ai:
